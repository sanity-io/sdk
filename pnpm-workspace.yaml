packages:
  - examples
  - packages/@repo/*
  - packages/*
  - apps/*
  - '@repo/package.config'

overrides:
  '@babel/types': 7.29.7

onlyBuiltDependencies:
  - esbuild

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@portabletext/*'
  - '@sanity/*'
  - '@types/*'
  - 'groq-js'
  - 'groq'
  - 'lodash-es'
  - 'react-rx'
  - 'sanity'
  - 'use-effect-event'
  - 'dotenv'
  - 'oxfmt'
  - '@oxfmt/*'
  # Renovate security update: react-router@7.18.2
  - react-router@7.18.2

catalog:
  '@playwright/test': '^1.61.1'
  '@sanity/browserslist-config': '^1.0.5'
  '@sanity/client': '^8.4.0'
  '@sanity/comlink': '^4.0.3'
  '@sanity/message-protocol': '^0.24.0'
  '@sanity/pkg-utils': '^12.1.0'
  '@sanity/tsconfig': '^2.2.1'
  '@sanity/types': '^6.12.0'
  'sanity': '^6.12.0'
  '@testing-library/jest-dom': '^6.9.1'
  '@testing-library/react': '^16.3.3'
  '@types/lodash-es': '^4.17.12'
  '@types/node': '^24.13.3'
  '@types/react': '^19.2.17'
  '@types/react-dom': '^19.2.3'
  '@vitejs/plugin-react': '^6.0.3'
  '@vitest/coverage-v8': '^4.1.10'
  eslint: '^10.9.1'
  groq: '3.88.1-typegen-experimental.0'
  groq-js: '^2.0.0'
  lodash-es: '^4.18.1'
  oxfmt: '^0.58.0'
  react: '^19.2.8'
  react-compiler-runtime: '^1.0.0'
  react-dom: '^19.2.8'
  react-error-boundary: '^6.1.2'
  rimraf: '^6.0.1'
  rolldown: '^1.2.3'
  rxjs: '^7.8.2'
  tsx: '^4.23.1'
  typescript: '^7.0.2'
  vite: '^8.1.5'
  vitest: '^4.1.10'
