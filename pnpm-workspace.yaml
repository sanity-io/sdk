packages:
  - examples
  - packages/@repo/*
  - packages/*
  - apps/*
  - '@repo/package.config'

allowBuilds:
  esbuild: true
  unrs-resolver: false

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@portabletext/*'
  - '@sanity/*'
  - '@types/*'
  - 'get-it'
  - 'groq-js'
  - 'groq'
  - 'lodash-es'
  - 'react-rx'
  - 'sanity'
  - 'use-effect-event'
  - 'dotenv'
  - 'oxfmt'
  - '@oxfmt/*'
  # Renovate security update: react-router@7.18.2
  - react-router@7.18.2

overrides:
  # rolldown 1.2.14 crashes api-extractor during `pkg build`; unpin once microsoft/rushstack#6156 is fixed
  rolldown: 1.2.13

catalog:
  '@playwright/test': '^1.64.1'
  '@sanity/browserslist-config': '^1.0.5'
  '@sanity/client': '^8.10.0'
  '@sanity/comlink': '^4.0.3'
  '@sanity/message-protocol': '^0.24.0'
  '@sanity/pkg-utils': '^13.0.15'
  '@sanity/tsconfig': '^2.2.1'
  '@sanity/types': '^6.20.0'
  'sanity': '^6.20.0'
  '@testing-library/jest-dom': '^7.0.1'
  '@testing-library/react': '^16.3.3'
  '@types/lodash-es': '^4.17.12'
  '@types/node': '^24.19.2'
  '@types/react': '^19.3.0'
  '@types/react-dom': '^19.3.0'
  '@vitejs/plugin-react': '^6.1.2'
  '@vitest/coverage-v8': '^5.0.5'
  groq: '^6.20.0'
  groq-js: '^2.0.0'
  jsdom: '^30.1.3'
  lodash-es: '^4.18.1'
  oxfmt: '^0.74.0'
  oxlint: '^1.88.0'
  react: '^19.3.1'
  react-compiler-runtime: '^1.0.0'
  react-dom: '^19.3.1'
  react-error-boundary: '^6.1.6'
  rimraf: '^6.0.1'
  rolldown: '^1.2.12'
  rxjs: '^7.8.2'
  tsx: '^4.23.15'
  typescript: '^6.0.3'
  vite: '^8.3.4'
  vitest: '^5.0.5'
