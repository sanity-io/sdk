packages:
  - examples
  - packages/@repo/*
  - packages/*
  - apps/*
  - '@repo/package.config'

overrides:
  '@babel/types': 7.29.7

allowBuilds:
  esbuild: true
  unrs-resolver: false

publicHoistPattern:
  - '*eslint*'

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@portabletext/*'
  - '@sanity/*'
  - '@types/*'
  - 'get-it'
  - 'groq-js'
  - 'groq'
  - 'lodash-es'
  - 'react-rx'
  - 'sanity'
  - 'use-effect-event'
  - 'dotenv'
  - 'oxfmt'
  - '@oxfmt/*'
  # Renovate security update: react-router@7.18.2
  - react-router@7.18.2

catalog:
  '@playwright/test': '^1.61.1'
  '@sanity/browserslist-config': '^1.0.5'
  '@sanity/client': '^8.6.1'
  '@sanity/comlink': '^4.0.3'
  '@sanity/message-protocol': '^0.24.0'
  '@sanity/pkg-utils': '^13.0.0'
  '@sanity/tsconfig': '^2.2.1'
  '@sanity/types': '^6.13.0'
  'sanity': '^6.13.2'
  '@testing-library/jest-dom': '^6.9.1'
  '@testing-library/react': '^16.3.3'
  '@types/lodash-es': '^4.17.12'
  '@types/node': '^24.13.4'
  '@types/react': '^19.3.0'
  '@types/react-dom': '^19.3.0'
  '@vitejs/plugin-react': '^6.1.1'
  '@vitest/coverage-v8': '^5.0.0'
  eslint: '^10.10.0'
  groq: '^6.13.2'
  groq-js: '^2.0.0'
  lodash-es: '^4.18.1'
  oxfmt: '^0.67.0'
  react: '^19.3.0'
  react-compiler-runtime: '^1.0.0'
  react-dom: '^19.3.0'
  react-error-boundary: '^6.1.5'
  rimraf: '^6.0.1'
  rolldown: '^1.2.8'
  rxjs: '^7.8.2'
  tsx: '^4.23.13'
  typescript: '^6.0.3'
  vite: '^8.3.0'
  vitest: '^5.0.0'
