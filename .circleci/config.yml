version: 2.1

# Kept until the CircleCI project is disconnected: without a config, every push errors.
workflows:
  # Needed for https://github.com/CircleCI-Public/circleci-cli/issues/577
  # If not the job will be marked as failed for skipped
  noopworkflow:
    jobs:
      - noop:
          filters:
            branches:
              only: main

jobs:
  # Needed for https://github.com/CircleCI-Public/circleci-cli/issues/577
  # If not the job will be marked as failed for skipped
  noop:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          command: |
            echo "do nothing"
