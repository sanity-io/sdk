name: Auto-updates E2E Tests

on:
  push:
    branches: [main, sdk-2971/auto-updates-e2e]
  workflow_dispatch:
  workflow_call:
    inputs:
      sdk-version:
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-auto-updates

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SANITY_INTERNAL_ENV: staging
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_STAGING_DEPLOY_TOKEN }}
      SDK_VERSION: ${{ inputs.sdk-version }}
      SANITY_APP_E2E_ORGANIZATION_ID: ${{ secrets.SDK_E2E_ORGANIZATION_ID }}
      SDK_E2E_USER_ID: ${{ secrets.SDK_E2E_USER_ID }}
      SDK_E2E_USER_PASSWORD: ${{ secrets.SDK_E2E_USER_PASSWORD }}
      RECAPTCHA_E2E_STAGING_KEY: ${{ secrets.RECAPTCHA_E2E_STAGING_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup
        with:
          node-version: 22

      - name: Pin SDK version
        if: inputs.sdk-version
        run: |
          (cd packages/core && npm pkg set version="$SDK_VERSION")
          (cd packages/react && npm pkg set version="$SDK_VERSION")
          until [ "$(curl -sS -H 'accept: application/json' \
            "https://sanity-cdn.work/v1/modules/@sanity__sdk-react/default/%5E$SDK_VERSION/t$(date +%s)" \
            | jq -r .packageVersion)" = "$SDK_VERSION" ]; do sleep 60; done

      - name: Deploy app
        working-directory: apps/auto-updates-react
        run: |
          set -o pipefail
          APP_ID=$(pnpm exec sanity deploy --create --title "SDK auto-updates e2e" --yes --json | jq -r '.application.id')
          echo "SANITY_APP_E2E_AUTO_UPDATES_APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e:auto-updates -- --project chromium
