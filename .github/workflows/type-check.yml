name: Type Check

on:
  # Build on pushes to branches that have a PR (including drafts)
  pull_request:
  # Build on pushes to the main branch
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  type-check:
    name: type-check (TypeScript ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: [6, 7]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          node-version: 22

      - name: Type Check
        # Packages use TypeScript 7; the root's TypeScript 6 (kept for typedoc) covers the 6 run
        env:
          TSC: ${{ matrix.typescript == 6 && format('{0}/node_modules/typescript/bin/tsc', github.workspace) || '' }}
        run: pnpm ts:check
