name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # for checkout

jobs:
  release:
    outputs:
      published: ${{ steps.publish.outputs.published }}
      hasChangesets: ${{ steps.changesets.outputs['has-changesets'] }}
    permissions:
      contents: read # for checkout
      id-token: write # to enable use of OIDC for npm provenance
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: generate-token
        with:
          client-id: ${{ secrets.ECOSPARK_APP_ID }}
          private-key: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch-depth: 0 so @changesets/changelog-github can look up the commit
          # that added each changeset file.
          fetch-depth: 0
          # Use the app token so pushes to the Version PR branch trigger CI.
          token: ${{ steps.generate-token.outputs.token }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --ignore-scripts --no-runtime

      # Maintains a "chore: release" Version PR. When that PR merges the pending
      # changesets are consumed and the versions are bumped; the publish steps
      # below then run because no changesets remain.
      - name: Changesets version PR
        id: changesets
        uses: changesets/action@66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4 # v2.1.2
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          pr-title: 'chore: release'
          commit-message: 'chore: release'
          # We cut a single sdk-vX.Y.Z tag + release ourselves below.
          create-github-releases: false
          push-git-tags: false
        env:
          # changelog-github reads GITHUB_TOKEN when the action runs changeset version.
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      # Publish once no changesets remain (i.e. the Version PR just merged). Each
      # step is idempotent: a rerun or a no-op push that is already on the
      # registry sets published=false and skips the rest.
      - name: Check registry for current version
        id: version
        if: steps.changesets.outputs['has-changesets'] == 'false'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Both packages share the version (fixed), so checking core is enough.
          if npm view "@sanity/sdk@$VERSION" version > /dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        if: steps.changesets.outputs['has-changesets'] == 'false' && steps.version.outputs.already-published == 'false'
        run: pnpm build:packages

      - name: Smoke test packed tarballs
        if: steps.changesets.outputs['has-changesets'] == 'false' && steps.version.outputs.already-published == 'false'
        run: pnpm test:pack

      - name: Set publishing config
        if: steps.changesets.outputs['has-changesets'] == 'false' && steps.version.outputs.already-published == 'false'
        run: pnpm config set '//registry.npmjs.org/:_authToken' "${NODE_AUTH_TOKEN}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      # `changeset publish` detects pnpm and shells out to `pnpm publish`, which
      # rewrites the react `workspace:*` dep to the exact version and runs
      # prepublishOnly. `--no-git-tag` stops the per-package tags; we cut a single
      # tag + release below instead.
      - name: Publish to npm
        id: publish
        if: steps.changesets.outputs['has-changesets'] == 'false' && steps.version.outputs.already-published == 'false'
        run: |
          pnpm changeset publish --no-git-tag
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          NPM_CONFIG_PROVENANCE: true

      # Single tag + release the rest of the pipeline keys off (release-notes,
      # upload-docs, Linear, CircleCI). release-notes.yml posts the release body
      # to Slack, so the body is the Changesets text: the top section of each
      # package changelog.
      - name: Create tag and GitHub release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo '### @sanity/sdk'
            echo ''
            awk '/^## /{n++} n==1' packages/core/CHANGELOG.md
            echo ''
            echo '### @sanity/sdk-react'
            echo ''
            awk '/^## /{n++} n==1' packages/react/CHANGELOG.md
          } > notes.md
          gh release create "sdk-v$VERSION" --target "$GITHUB_SHA" --title "sdk-v$VERSION" --notes-file notes.md

  post-release-steps:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    steps:
      - name: Mark SDK issues as done
        uses: sanity-labs/mark-issues-done-action@88e6a3e6bc5a9c86d45873c4dba3302a4cafcb65 # main
        with:
          linear_api_key: ${{secrets.LINEAR_API_KEY}}
          repository_name: ${{github.event.repository.name}}
          # Label: In Staging
          initial_state_id: 'c56956cd-c281-4ca5-889f-6189ce231a6d'
          # Label: Shipped
          done_state_id: '5a35b7bf-6d37-4cc2-854a-2f18d160e2e5'

      - name: Trigger CircleCI Pipeline
        uses: CircleCI-Public/trigger-circleci-pipeline-action@a81cd720792a6088debd7f182b552845abb86f1b # v1.2.0
        env:
          CCI_TOKEN: ${{ secrets.CCI_TOKEN }}
