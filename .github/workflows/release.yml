name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # for checkout

jobs:
  release:
    outputs:
      published: ${{ steps.publish.outputs.published }}
      hasChangesets: ${{ steps.changesets.outputs['has-changesets'] }}
    permissions:
      contents: read # for checkout
      id-token: write # to enable use of OIDC for npm provenance
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: generate-token
        with:
          client-id: ${{ secrets.ECOSPARK_APP_ID }}
          private-key: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch-depth: 0 so @changesets/changelog-github can look up the commit
          # that added each changeset file.
          fetch-depth: 0
          # Use the app token so pushes to the Version PR branch trigger CI.
          token: ${{ steps.generate-token.outputs.token }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: pnpm
          # devEngines.runtime pins node; npm 11 refuses to run under a mismatched version.
          node-version-file: package.json
      - run: pnpm install --ignore-scripts --no-runtime

      # Maintains a "chore: release" Version PR. When that PR merges the pending
      # changesets are consumed and the versions are bumped; the publish steps
      # below then run because no changesets remain.
      - name: Changesets version PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          pr-title: 'chore: release'
          commit-message: 'chore: release'
          # We cut a single sdk-vX.Y.Z tag + release ourselves below.
          create-github-releases: false
          push-git-tags: false
        env:
          # changelog-github reads GITHUB_TOKEN when the action runs changeset version.
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Assert changesets action output
        env:
          HAS_CHANGESETS: ${{ steps.changesets.outputs['has-changesets'] }}
        run: |
          if [ -z "$HAS_CHANGESETS" ]; then
            echo "::error::changesets/action did not set the has-changesets output; check the pinned action version's output names."
            exit 1
          fi

      # Publish once no changesets remain (i.e. the Version PR just merged). Each
      # step is idempotent: a rerun or a no-op push that is already on the
      # registry sets published=false and skips the rest.
      - name: Check registry for current version
        id: version
        if: steps.changesets.outputs['has-changesets'] == 'false'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The publish step skips packages already on the registry, so a rerun
          # after a partial publish republishes only the missing one. Only treat the
          # version as fully published when BOTH packages are already on the registry.
          # Only E404 means "not published"; any other npm error must fail the job
          # rather than be read as a missing version.
          published=true
          for pkg in @sanity/sdk @sanity/sdk-react; do
            if ! out=$(npm view "$pkg@$VERSION" version 2>&1); then
              case "$out" in
                *E404*) published=false ;;
                *) echo "$out"; echo "::error::npm view $pkg@$VERSION failed"; exit 1 ;;
              esac
            fi
          done
          echo "already-published=$published" >> "$GITHUB_OUTPUT"

      - name: Build packages
        if: steps.changesets.outputs['has-changesets'] == 'false' && steps.version.outputs.already-published == 'false'
        run: pnpm build:packages

      - name: Smoke test packed tarballs
        if: steps.changesets.outputs['has-changesets'] == 'false' && steps.version.outputs.already-published == 'false'
        run: pnpm test:pack

      # Publishes @sanity/sdk, waits until npm serves it, then publishes
      # @sanity/sdk-react and waits again, so the exact sdk version react pins is
      # always installable first and the tag + release below only go out once
      # both are. `pnpm publish` rewrites the react `workspace:*` dep to the exact
      # version and runs prepublishOnly. This step only runs when at least one
      # package was missing from npm, so a success means this run finished
      # publishing it.
      # No npm token on purpose: pnpm silently falls back to it and skips provenance
      # when trusted publishing (OIDC) fails.
      - name: Publish to npm
        id: publish
        if: steps.changesets.outputs['has-changesets'] == 'false' && steps.version.outputs.already-published == 'false'
        run: |
          pnpm release:publish latest
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Single tag + release the rest of the pipeline keys off (release-notes,
      # upload-docs, Linear). release-notes.yml posts the release body
      # to Slack, so the body is the Changesets text: the top section of each
      # package changelog.
      - name: Create tag and GitHub release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo '### @sanity/sdk'
            echo ''
            awk '/^## /{n++} n==1' packages/core/CHANGELOG.md
            echo ''
            echo '### @sanity/sdk-react'
            echo ''
            awk '/^## /{n++} n==1' packages/react/CHANGELOG.md
          } > notes.md
          gh release create "sdk-v$VERSION" --target "$GITHUB_SHA" --title "sdk-v$VERSION" --notes-file notes.md

      # Point `next` at this stable release so it never trails `latest`. The
      # snapshot job below only ever moves `next` forward from here. One VERSION
      # for both packages relies on the `fixed` group in .changeset/config.json.
      # Trusted publishing only authorizes publish, so dist-tag still needs the token.
      - name: Move the next dist-tag to the stable release
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          pnpm config set '//registry.npmjs.org/:_authToken' "${NODE_AUTH_TOKEN}"
          pnpm dist-tag add "@sanity/sdk@$VERSION" next
          pnpm dist-tag add "@sanity/sdk-react@$VERSION" next

  # Publish a `next` snapshot on every push to main that still has pending
  # changesets. Once the Version PR merges the changesets are gone,
  # hasChangesets is false, the release job publishes stable, and this is
  # skipped. concurrency (no cancel-in-progress) serialises it with stable
  # publishes.
  snapshot:
    needs: release
    if: needs.release.outputs.hasChangesets == 'true'
    permissions:
      actions: write # to dispatch the auto-updates e2e
      contents: read # for checkout
      id-token: write # to enable use of OIDC for npm provenance
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch-depth: 0 so @changesets/changelog-github can look up the commit
          # that added each changeset file.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: pnpm
          # devEngines.runtime pins node; npm 11 refuses to run under a mismatched version.
          node-version-file: package.json
      - run: pnpm install --ignore-scripts --no-runtime

      # Calculate the snapshot version from the pending changesets, e.g.
      # 3.3.0-next.20260915103000. changelog-github runs here too, but its
      # changelog edits are thrown away with the runner.
      - name: Version snapshot
        run: pnpm changeset version --snapshot next
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # `changeset version --snapshot` is a silent no-op when there are no
      # changesets. Fail loudly if the gate and this job's config ever disagree.
      - name: Guard against empty snapshot
        id: version
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          case "$VERSION" in
            *-next.*) ;;
            *) echo "::error::Expected a -next snapshot version, got $VERSION. The job gate and the changeset config disagree."; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: pnpm build:packages

      - name: Smoke test packed tarballs
        run: pnpm test:pack

      # The `next` tag keeps the snapshot off `latest`. Publishes in dependency
      # order like the stable publish above, so `@sanity/sdk-react@next` never
      # points at an sdk snapshot npm is not serving yet.
      - name: Publish snapshot to npm
        run: pnpm release:publish next

      - name: Upload snapshot bundles for auto-updates to staging
        env:
          GOOGLE_PROJECT_ID: ${{ secrets.GCS_STAGING_PROJECT_ID }}
          GCLOUD_SERVICE_KEY: ${{ secrets.GCS_STAGING_SERVICE_KEY }}
          GCLOUD_BUCKET: ${{ secrets.GCS_STAGING_BUCKET }}
        run: |
          pnpm build:bundle
          pnpm upload:bundles

      - name: Run the auto-updates e2e against the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run e2e-auto-updates.yml -f sdk-version="$VERSION"

  # Retry a failed upload with "Re-run failed jobs": a full re-run finds the version on npm and skips this job.
  upload-bundles:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read # for checkout
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: pnpm
          node-version-file: package.json
      - run: pnpm install --ignore-scripts --no-runtime
      - run: pnpm build:bundle

      - name: Upload bundles to the staging module server
        env:
          GOOGLE_PROJECT_ID: ${{ secrets.GCS_STAGING_PROJECT_ID }}
          GCLOUD_SERVICE_KEY: ${{ secrets.GCS_STAGING_SERVICE_KEY }}
          GCLOUD_BUCKET: ${{ secrets.GCS_STAGING_BUCKET }}
        run: pnpm upload:bundles

      - name: Upload bundles to the production module server
        env:
          GOOGLE_PROJECT_ID: ${{ secrets.GCS_PRODUCTION_PROJECT_ID }}
          GCLOUD_SERVICE_KEY: ${{ secrets.GCS_PRODUCTION_SERVICE_KEY }}
          GCLOUD_BUCKET: ${{ secrets.GCS_PRODUCTION_BUCKET }}
        run: pnpm upload:bundles

  post-release-steps:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    steps:
      - name: Mark SDK issues as done
        uses: sanity-labs/mark-issues-done-action@88e6a3e6bc5a9c86d45873c4dba3302a4cafcb65 # main
        with:
          linear_api_key: ${{secrets.LINEAR_API_KEY}}
          repository_name: ${{github.event.repository.name}}
          # Label: In Staging
          initial_state_id: 'c56956cd-c281-4ca5-889f-6189ce231a6d'
          # Label: Shipped
          done_state_id: '5a35b7bf-6d37-4cc2-854a-2f18d160e2e5'
