name: Post Release Notes to Slack

on:
  release:
    types: [published] # triggers only when a new release is published

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Convert markdown to slack markdown
        uses: LoveToKnow/slackify-markdown-action@698a1d4d0ff1794152a93c03ee8ca5e03a310d4e # v1.1.1
        id: releasemarkdown
        with:
          text: "## Notes:\n${{ github.event.release.body }}"

      # Slack rejects a section block whose text is over 3000 characters, and
      # Changesets release bodies cover both packages, so they run well past
      # that. Split the notes on paragraph breaks into sections of at most
      # 2900 characters, keeping a code block that contains blank lines in one
      # piece so its fences land in the same section. A message holds at most
      # 50 blocks, so the last one links to the release when notes run over.
      - name: Build Slack payload
        id: payload
        env:
          NOTES: ${{ steps.releasemarkdown.outputs.text }}
          NAME: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
        run: |
          payload=$(jq -cn --arg notes "$NOTES" --arg name "$NAME" --arg url "$URL" '
            def fenceOpen: [match("```"; "g")] | length % 2 == 1;
            def paragraphs:
              reduce ($notes | split("\n\n")[] | select(length > 0)) as $p ({out: [], open: false};
                if .open then .out[-1] += "\n\n" + $p else .out += [$p] end
                | .open = (.out[-1] | fenceOpen))
              | .out;
            def chunks($max):
              reduce (
                paragraphs[] | . as $p | range(0; length; $max) as $i | $p[$i:$i + $max]
              ) as $para ([];
                if length > 0 and (.[length - 1] | length) + ($para | length) + 2 <= $max
                then .[length - 1] += "\n\n" + $para
                else . + [$para]
                end);
            [chunks(2900)[] | {type: "section", text: {type: "mrkdwn", text: .}}] as $sections
            | {
                icon_emoji: "ship-it-pirate",
                text: "New SDK Release Published: \($name)",
                blocks: ([
                  {type: "header", text: {type: "plain_text", text: "New SDK Release Published!"}},
                  {type: "section", fields: [{type: "mrkdwn", text: "*Name:*\n<\($url)|\($name)>"}]}
                ] + if ($sections | length) > 48
                  then $sections[:47] + [{type: "section", text: {type: "mrkdwn", text: "_Notes truncated, see <\($url)|the full release>._"}}]
                  else $sections
                  end)
              }')
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Send release notes to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # Fail the run when Slack rejects the payload instead of passing silently.
          errors: true
          payload: ${{ steps.payload.outputs.payload }}
