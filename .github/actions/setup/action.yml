name: 'Setup Environment'
description: 'Sets up Node.js, pnpm, and dependencies'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      id: node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Get pnpm store directory
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      shell: bash

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-node-${{ inputs.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-node-${{ inputs.node-version }}-
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      # Use setup-node's version so each CI matrix entry tests its requested runtime.
      run: pnpm install --frozen-lockfile --no-runtime
      shell: bash

    - name: Verify Node.js runtime
      env:
        EXPECTED_NODE_VERSION: ${{ steps.node.outputs.node-version }}
      run: |
        actual="$(pnpm exec node --version)"
        if [ "${actual#v}" != "${EXPECTED_NODE_VERSION#v}" ]; then
          echo "::error::Expected Node $EXPECTED_NODE_VERSION, but pnpm uses $actual"
          exit 1
        fi
      shell: bash
